<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-labelledby="titulo">
  <title id="titulo">Bem-Estar: janela em arco ao entardecer, espada-de-são-jorge, planta pendente e tapetes de yoga</title>
  <defs>
    <linearGradient id="entardecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D2AE"/>
      <stop offset="1" stop-color="#E29A6C"/>
    </linearGradient>
    <clipPath id="janela">
      <path d="M150 520 V250 A150 150 0 0 1 450 250 V520 Z"/>
    </clipPath>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 1.1 -0.2"/>
    </filter>
  </defs>

  <!-- parede -->
  <rect width="600" height="750" fill="#EAE0D0"/>
  <path d="M162 532 V262 A150 150 0 0 1 462 262 V532 Z" fill="#D9CBB6" opacity="0.6"/>

  <!-- vista da janela -->
  <g clip-path="url(#janela)">
    <rect x="150" y="100" width="300" height="420" fill="url(#entardecer)"/>
    <circle cx="300" cy="392" r="62" fill="#F8E6CD" opacity="0.95"/>
    <path d="M150 420 C210 392 260 396 320 418 C380 440 420 436 450 420 V520 H150 Z" fill="#B7BC95"/>
    <path d="M150 462 C220 444 290 452 350 470 C400 484 430 480 450 474 V520 H150 Z" fill="#8E9A6C"/>
  </g>
  <path d="M150 520 V250 A150 150 0 0 1 450 250 V520 Z" fill="none" stroke="#F7F1E8" stroke-width="14"/>
  <path d="M300 100 V520 M150 330 H450" stroke="#F7F1E8" stroke-width="7"/>
  <rect x="128" y="514" width="344" height="20" rx="5" fill="#F7F1E8"/>
  <rect x="134" y="534" width="332" height="8" fill="#D9CBB6"/>

  <!-- piso -->
  <rect x="0" y="568" width="600" height="182" fill="#D2B994"/>
  <rect x="0" y="560" width="600" height="12" fill="#F1E8DA"/>
  <g stroke="#C2A67F" stroke-width="2">
    <path d="M0 616 H600 M0 672 H600 M0 730 H600"/>
  </g>

  <!-- tapete de yoga estendido -->
  <path d="M196 640 H418 L466 716 H150 Z" fill="#97A177"/>
  <path d="M150 716 H466 V724 H150 Z" fill="#7B8761"/>

  <!-- garrafa de água -->
  <rect x="404" y="592" width="28" height="70" rx="11" fill="#4F5A3A"/>
  <rect x="409" y="578" width="18" height="16" rx="4" fill="#2A211B"/>
  <rect x="410" y="610" width="6" height="34" rx="3" fill="#7B8761"/>

  <!-- tapete enrolado -->
  <g transform="rotate(-7 498 670)">
    <rect x="472" y="430" width="54" height="240" rx="26" fill="#964322"/>
    <ellipse cx="499" cy="434" rx="27" ry="11" fill="#C0603A"/>
    <path d="M499 434 m-15 0 a15 6 0 1 0 30 0 a11 4 0 1 0 -22 0" fill="none" stroke="#964322" stroke-width="2"/>
    <rect x="470" y="500" width="58" height="10" fill="#F1E8DA" opacity="0.9"/>
    <rect x="470" y="602" width="58" height="10" fill="#F1E8DA" opacity="0.9"/>
  </g>

  <!-- espada-de-são-jorge -->
  <g stroke="#B9B985" stroke-width="2">
    <path d="M74 560 C56 506 46 466 40 424 C64 466 80 506 90 560 Z" fill="#7D8A62"/>
    <path d="M86 560 C70 480 74 420 90 352 C104 424 106 494 102 560 Z" fill="#4F5A3A"/>
    <path d="M102 560 C96 456 104 372 122 300 C134 384 132 476 122 560 Z" fill="#6E7A55"/>
    <path d="M120 560 C122 486 136 424 154 382 C156 444 148 504 138 560 Z" fill="#55603F"/>
    <path d="M132 560 C142 510 162 474 180 452 C172 494 160 530 150 560 Z" fill="#6E7A55"/>
  </g>
  <path d="M44 556 H176 L162 676 H58 Z" fill="#C0603A"/>
  <rect x="38" y="548" width="144" height="20" rx="5" fill="#A9502E"/>
  <path d="M150 576 L140 664" stroke="#D27752" stroke-width="6" stroke-linecap="round"/>

  <!-- planta pendente -->
  <path d="M540 0 V96" stroke="#5C5047" stroke-width="2"/>
  <path d="M508 118 L540 96 L572 118" fill="none" stroke="#5C5047" stroke-width="2"/>
  <g fill="none" stroke="#55603F" stroke-width="3" stroke-linecap="round">
    <path d="M518 140 C508 190 528 230 514 290"/>
    <path d="M560 146 C572 200 556 236 566 280"/>
  </g>
  <g fill="#6E7A55">
    <ellipse cx="512" cy="170" rx="7" ry="11" transform="rotate(-30 512 170)"/>
    <ellipse cx="524" cy="205" rx="7" ry="11" transform="rotate(30 524 205)" fill="#55603F"/>
    <ellipse cx="512" cy="240" rx="7" ry="11" transform="rotate(-30 512 240)"/>
    <ellipse cx="518" cy="278" rx="7" ry="11" transform="rotate(20 518 278)" fill="#55603F"/>
    <ellipse cx="568" cy="180" rx="7" ry="11" transform="rotate(30 568 180)" fill="#55603F"/>
    <ellipse cx="558" cy="216" rx="7" ry="11" transform="rotate(-30 558 216)"/>
    <ellipse cx="568" cy="252" rx="7" ry="11" transform="rotate(25 568 252)" fill="#55603F"/>
    <ellipse cx="520" cy="112" rx="13" ry="9"/>
    <ellipse cx="540" cy="106" rx="13" ry="9" fill="#55603F"/>
    <ellipse cx="560" cy="112" rx="13" ry="9"/>
  </g>
  <path d="M506 116 H574 Q570 160 540 162 Q510 160 506 116 Z" fill="#F1E8DA"/>

  <!-- grão -->
  <rect width="600" height="750" filter="url(#grao)" opacity="0.18"/>
</svg>
