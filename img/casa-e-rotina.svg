<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-labelledby="titulo">
  <title id="titulo">Casa e Rotina: aparador com livros, planta, vela, cadernos e vaso de plumas, com relógio marcando 7 horas</title>
  <defs>
    <pattern id="ripas" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect width="12" height="10" fill="#C08A5E"/>
      <rect width="2" height="10" fill="#AE784E"/>
    </pattern>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 1.1 -0.2"/>
    </filter>
  </defs>

  <!-- parede e arco pintado -->
  <rect width="600" height="750" fill="#EFE6D8"/>
  <path d="M150 480 V262 A150 150 0 0 1 450 262 V480 Z" fill="#E6CBA4"/>

  <!-- quadro -->
  <path d="M80 118 L44 134 M80 118 L116 134" stroke="#5C5047" stroke-width="1.5"/>
  <circle cx="80" cy="118" r="3" fill="#5C5047"/>
  <rect x="34" y="132" width="92" height="124" rx="4" fill="#F8F3EC" stroke="#A87449" stroke-width="6"/>
  <circle cx="80" cy="180" r="18" fill="#C0603A"/>
  <path d="M40 236 C60 212 84 214 120 224 V250 H40 Z" fill="#7D8A62"/>

  <!-- relógio às 7h -->
  <circle cx="304" cy="232" r="56" fill="#2A211B" opacity="0.08"/>
  <circle cx="300" cy="226" r="56" fill="#F8F3EC" stroke="#2A211B" stroke-width="5"/>
  <g stroke="#2A211B" stroke-width="3" stroke-linecap="round">
    <path d="M300 180 L300 191"/>
    <path d="M323 186.2 L319.5 192.2"/>
    <path d="M339.8 203 L333.8 206.5"/>
    <path d="M346 226 L335 226"/>
    <path d="M339.8 249 L333.8 245.5"/>
    <path d="M323 265.8 L319.5 259.8"/>
    <path d="M300 272 L300 261"/>
    <path d="M277 265.8 L280.5 259.8"/>
    <path d="M260.2 249 L266.2 245.5"/>
    <path d="M254 226 L265 226"/>
    <path d="M260.2 203 L266.2 206.5"/>
    <path d="M277 186.2 L280.5 192.2"/>
  </g>
  <path d="M300 226 L287 248.5" stroke="#2A211B" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 226 L300 190" stroke="#2A211B" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="300" cy="226" r="5" fill="#C0603A"/>

  <!-- piso e rodapé -->
  <rect x="0" y="716" width="600" height="8" fill="#F1E8DA"/>
  <rect x="0" y="724" width="600" height="26" fill="#D2B994"/>

  <!-- aparador -->
  <rect x="104" y="680" width="14" height="44" fill="#8F6040"/>
  <rect x="482" y="680" width="14" height="44" fill="#8F6040"/>
  <rect x="86" y="490" width="428" height="190" fill="#C08A5E"/>
  <rect x="104" y="508" width="190" height="154" rx="4" fill="url(#ripas)" stroke="#A87449" stroke-width="4"/>
  <rect x="306" y="508" width="190" height="154" rx="4" fill="url(#ripas)" stroke="#A87449" stroke-width="4"/>
  <circle cx="282" cy="585" r="5" fill="#5C5047"/>
  <circle cx="318" cy="585" r="5" fill="#5C5047"/>
  <rect x="70" y="470" width="460" height="20" rx="4" fill="#A87449"/>

  <!-- livros e planta -->
  <rect x="104" y="448" width="128" height="22" rx="3" fill="#4F5A3A"/>
  <rect x="112" y="428" width="112" height="20" rx="3" fill="#F4ECE0"/>
  <rect x="100" y="410" width="120" height="18" rx="3" fill="#C0603A"/>
  <rect x="140" y="456" width="44" height="5" rx="2.5" fill="#9AA37A"/>
  <rect x="150" y="436" width="34" height="4" rx="2" fill="#D9C9B0"/>
  <rect x="126" y="417" width="38" height="4" rx="2" fill="#E8A57E"/>
  <g fill="#6E7A55">
    <ellipse cx="146" cy="356" rx="11" ry="19" transform="rotate(-30 146 356)"/>
    <ellipse cx="174" cy="354" rx="11" ry="19" transform="rotate(30 174 354)" fill="#55603F"/>
    <ellipse cx="160" cy="344" rx="10" ry="21"/>
    <ellipse cx="136" cy="372" rx="9" ry="15" transform="rotate(-60 136 372)" fill="#55603F"/>
    <ellipse cx="184" cy="372" rx="9" ry="15" transform="rotate(60 184 372)"/>
  </g>
  <path d="M140 376 H180 L174 410 H146 Z" fill="#EEE4D5"/>

  <!-- vela -->
  <circle cx="267" cy="394" r="28" fill="#F6C48E" opacity="0.35"/>
  <rect x="250" y="418" width="34" height="52" rx="4" fill="#F8F3EC"/>
  <rect x="250" y="418" width="34" height="8" rx="4" fill="#EFE5D6"/>
  <path d="M267 418 V410" stroke="#2A211B" stroke-width="2"/>
  <path d="M267 410 C258 398 262 386 267 376 C272 386 276 398 267 410 Z" fill="#EE9A5C"/>
  <path d="M267 406 C263 400 264 394 267 388 C270 394 271 400 267 406 Z" fill="#FBE3B6"/>

  <!-- cadernos -->
  <rect x="300" y="456" width="70" height="14" rx="2" fill="#7D8A62"/>
  <rect x="306" y="444" width="58" height="12" rx="2" fill="#E6CBA4"/>
  <path d="M352 444 V460" stroke="#C0603A" stroke-width="3"/>

  <!-- vaso com plumas -->
  <g fill="none" stroke="#B59A72" stroke-width="2.5" stroke-linecap="round">
    <path d="M414 366 C404 336 392 308 378 288"/>
    <path d="M418 366 C418 326 418 296 420 256"/>
    <path d="M422 366 C432 334 444 306 462 286"/>
    <path d="M424 366 C444 346 466 332 492 324"/>
  </g>
  <g fill="#EAD8B9">
    <ellipse cx="374" cy="280" rx="12" ry="30" transform="rotate(-30 374 280)"/>
    <ellipse cx="420" cy="244" rx="12" ry="32"/>
    <ellipse cx="466" cy="276" rx="12" ry="30" transform="rotate(40 466 276)"/>
    <ellipse cx="498" cy="318" rx="11" ry="28" transform="rotate(65 498 318)"/>
  </g>
  <path d="M404 470 C388 440 390 400 410 382 V364 H430 V382 C450 400 452 440 436 470 Z" fill="#F8F3EC"/>
  <path d="M436 396 C446 414 446 446 434 464" fill="none" stroke="#E5D6C1" stroke-width="5" stroke-linecap="round"/>

  <!-- grão -->
  <rect width="600" height="750" filter="url(#grao)" opacity="0.18"/>
</svg>
